repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .prettierignore
    - .prettierignore
    - .prettierignore
    - LICENSE
    - CODE_OF_CONDUCT.md
    - assets/nf-core-scrna-aggregation_logo_light.png
    - docs/images/nf-core-scrna-aggregation_logo_light.png
    - docs/images/nf-core-scrna-aggregation_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - .prettierignore
    - .prettierrc.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - LICENSE
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-scrna-aggregation_logo_light.png
    - docs/images/nf-core-scrna-aggregation_logo_light.png
    - docs/images/nf-core-scrna-aggregation_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - CITATIONS.md
    - assets/multiqc_config.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: mccarroll
  name: scrna-aggregation
  description: A Nextflow workflow for merging mccarroll scrna results across multiple
    experiments
  author: James Nemesh
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - license
    - ci
    - igenomes
    - multiqc
    - fastqc
    - gpu
    - codespaces
    - vscode
    - code_linters
    - citations
    - rocrate
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
